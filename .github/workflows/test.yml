name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show the Chrome version
        run: /usr/bin/google-chrome --version

      - name: Run the API tests
        run: npm test -w api
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
